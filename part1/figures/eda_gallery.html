<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Ames House Prices - EDA gallery</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         margin: 0; background: #f5f6f8; color: #1f2933; }
  header { background: #1f3a5f; color: #fff; padding: 26px 40px; }
  header h1 { margin: 0 0 6px; font-size: 24px; }
  header p { margin: 0; opacity: .85; font-size: 14px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr));
          gap: 22px; padding: 28px 40px 48px; }
  .card { margin: 0; background: #fff; border-radius: 10px; overflow: hidden;
           box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .card img { width: 100%; display: block; }
  figcaption { padding: 12px 14px 14px; font-size: 13px; line-height: 1.45; color: #3e4c59; }
  figcaption strong { color: #1f3a5f; font-size: 13.5px; }
</style>
</head>
<body>
<header>
  <h1>Ames House Prices — exploratory data analysis</h1>
  <p>1,460 training sales · 79 explanatory variables · 16 figures. Generated by <code>code/02_eda.py</code>.</p>
</header>
<main>
    <figure class="card">
      <img src="fig01_target_distribution.png" alt="Target distribution">
      <figcaption><strong>Target distribution</strong><br>SalePrice is right-skewed (1.88); log(SalePrice) is near-normal (0.12).</figcaption>
    </figure>
    <figure class="card">
      <img src="fig02_missing_values.png" alt="Missing values by column">
      <figcaption><strong>Missing values by column</strong><br>Most blanks are structural absence, not lost data.</figcaption>
    </figure>
    <figure class="card">
      <img src="eda_missing_matrix.png" alt="Missingness matrix (supplementary)">
      <figcaption><strong>Missingness matrix (supplementary)</strong><br>Blue bands = structural absence; orange = genuinely missing values.</figcaption>
    </figure>
    <figure class="card">
      <img src="fig03_correlation.png" alt="Correlation among top predictors">
      <figcaption><strong>Correlation among top predictors</strong><br>Quality and size lead; the size block is internally redundant.</figcaption>
    </figure>
    <figure class="card">
      <img src="fig04_quality_price.png" alt="Price by overall quality">
      <figcaption><strong>Price by overall quality</strong><br>A monotone ladder from $50k to $432k median.</figcaption>
    </figure>
    <figure class="card">
      <img src="fig07_quality_categorical.png" alt="Price by kitchen / exterior quality">
      <figcaption><strong>Price by kitchen / exterior quality</strong><br>Ordered labels behave as an ordinal scale.</figcaption>
    </figure>
    <figure class="card">
      <img src="fig05_size_price.png" alt="Living area vs price">
      <figcaption><strong>Living area vs price</strong><br>Positive but heteroscedastic; the two partial sales break the trend.</figcaption>
    </figure>
    <figure class="card">
      <img src="fig13_outliers.png" alt="Outlier close-up">
      <figcaption><strong>Outlier close-up</strong><br>Only Ids 524 and 1299 pair >4,000 sq ft with a price below $300k.</figcaption>
    </figure>
    <figure class="card">
      <img src="fig06_neighborhood.png" alt="Median price by neighbourhood">
      <figcaption><strong>Median price by neighbourhood</strong><br>Location alone spans a factor of 3.6.</figcaption>
    </figure>
    <figure class="card">
      <img src="fig09_year_built.png" alt="Price by decade built">
      <figcaption><strong>Price by decade built</strong><br>Newer stock sells higher; the effect flattens before 1980.</figcaption>
    </figure>
    <figure class="card">
      <img src="fig10_seasonality.png" alt="Volume and price over time">
      <figcaption><strong>Volume and price over time</strong><br>Sales peak in May-July; 2010 medians dip.</figcaption>
    </figure>
    <figure class="card">
      <img src="fig08_sale_circumstances.png" alt="Price by sale condition">
      <figcaption><strong>Price by sale condition</strong><br>Partial and abnormal sales are systematically cheaper.</figcaption>
    </figure>
    <figure class="card">
      <img src="fig11_multicollinearity.png" alt="Near-duplicate measurements">
      <figcaption><strong>Near-duplicate measurements</strong><br>Basement vs 1st floor 0.82; garage cars vs area 0.88.</figcaption>
    </figure>
    <figure class="card">
      <img src="fig12_engineered_corr.png" alt="Engineered features vs price">
      <figcaption><strong>Engineered features vs price</strong><br>QualxTotalSF (0.86) beats raw TotalSF (0.78).</figcaption>
    </figure>
    <figure class="card">
      <img src="eda_pairplot.png" alt="Pairplot by price tier (supplementary)">
      <figcaption><strong>Pairplot by price tier (supplementary)</strong><br>The tiers separate on quality and size together, not on any single variable.</figcaption>
    </figure>
    <figure class="card">
      <img src="eda_types.png" alt="Price by dwelling type (supplementary)">
      <figcaption><strong>Price by dwelling type (supplementary)</strong><br>Single-family and two-storey homes dominate the upper range.</figcaption>
    </figure>
</main>
</body>
</html>
